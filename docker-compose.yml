# Docker Compose configuration for the distributed_log_processor project.
## Services:
##   logger:
##     - Builds the logger service from the Dockerfile located at ./src/services/logger.
##     - Mounts the local directory ./logs to /logs inside the container for persisted logs.
##     - Exposes port 8000 on the host and maps it to port 8000 in the container.
##     - Sets environment variables for configuring log verbosity and file path.

services:
  logger:
    build:
      context: .
      dockerfile: ./src/services/logger/Dockerfile
    volumes:
      - ./logs:/logs
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      # Write logs to the mounted volume
      - LOG_FILE_PATH=/logs/logger.log